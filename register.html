<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - 215 Supper Club</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="view active">
      <div class="registration-container">
        <h1>215 Supper Club</h1>
        <p class="subtitle">Create your passport</p>

        <form id="registrationForm">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" required>
          </div>

          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" required>
          </div>

          <div class="form-group">
            <label for="instaHandle">Instagram Handle</label>
            <input type="text" id="instaHandle" name="instaHandle" placeholder="@yourusername" required>
          </div>

          <button type="submit" id="submitBtn">Create Passport</button>
        </form>

        <div id="errorMessage" class="error-message" style="display: none;"></div>
        <div id="successMessage" class="success-message" style="display: none;"></div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="register.js"></script>
</body>
</html>
